name: CI Workflow MLProject

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install pandas scikit-learn mlflow

    - name: Run MLProject
      # Kita pakai env-manager=local biar proses CI cepat dan gak bentrok
      run: |
        mlflow run MLProject --env-manager=local

    - name: Upload Artifact Model ke GitHub
      uses: actions/upload-artifact@v4
      with:
        name: telco-model-artifact
        path: MLProject/saved_model/

    - name: Login ke Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image dengan MLflow
      run: |
        mlflow models build-docker -m MLProject/saved_model -n ${{ secrets.DOCKER_USERNAME }}/telco-model:latest

    - name: Push Docker Image ke Docker Hub
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/telco-model:latest